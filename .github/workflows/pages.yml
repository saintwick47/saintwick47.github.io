name: Deploy web

# Publica el sitio estático con Actions (más confiable que el build "legacy" de
# Pages, que fallaba sin dar detalle). Sube solo los archivos del sitio: excluye
# .git, las herramientas y los datos de trabajo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - name: Preparar el sitio
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' \
                --exclude='*.json.orig' --exclude='recetas_brewomatic_catalogo.*' \
                ./ _site/ || true
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
